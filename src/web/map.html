<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traffic map</title>
  <style>
    html, body, #map { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #0f1216; }
    body.transparent { background: transparent; }
    #status {
      position: absolute; left: 12px; bottom: 12px; padding: 4px 8px; border-radius: 4px;
      font: 12px system-ui, sans-serif; color: #fff; background: rgba(180, 40, 40, 0.85); display: none;
    }
    body.director #status { display: none !important; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status"></div>
  <script type="module" src="./map/main.ts"></script>
</body>
</html>
